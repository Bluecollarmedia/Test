name: Deploy to Netlify

on:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          npm install
          netlify deploy --prod --dir=. --site=edc5baa1-dc73-41f1-ae4e-047506160b63 --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --skip-functions-cache
